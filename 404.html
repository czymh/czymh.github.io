<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Zhao Chen</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .notfound { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; }
    .notfound-code { font-family: var(--font-mono); font-size: clamp(4rem, 16vw, 9rem); color: var(--accent); line-height: 1; margin-bottom: 16px; }
    .notfound h1 { font-size: 1.5rem; color: #fff; margin-bottom: 8px; }
    .notfound p { color: var(--text-muted); margin-bottom: 32px; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-code">404</div>
    <h1>This page drifted into deep space.</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a class="btn btn-primary" href="/">Back to home</a>
  </main>
</body>
</html>
